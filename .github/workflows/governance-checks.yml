name: Governance Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-verify:
    name: Docker Verify (Fail Fast)
    runs-on: ubuntu-latest
    env:
      CI: true
      GITHUB_ACTIONS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build verify image
        run: docker build -f Dockerfile.linux-verify -t pfas-linux-verify .

      - name: Run full Linux verify
        run: docker run --rm -e CI=true -e GITHUB_ACTIONS=true -v "${{ github.workspace }}:/app" -w /app pfas-linux-verify

  schema-lock:
    name: Schema Lock Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: CI registry check (governed core only)
        run: python scripts/verify_reference_registry.py --project-root .

      - name: Run schema lock tests
        run: python -m pytest src/v1/tests/test_schema_lock.py src/v2/tests/test_schema_lock.py -q
