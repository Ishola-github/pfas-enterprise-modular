name: Governance Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-verify:
    name: Docker Verify (Fail Fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build verify image
        run: docker build -f Dockerfile.linux-verify -t pfas-linux-verify .

      - name: Run full Linux verify
        run: docker run --rm -v "${{ github.workspace }}:/app" -w /app pfas-linux-verify

  schema-lock:
    name: Schema Lock Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run schema lock tests
        run: |
          python -c "from src.v1.tests.test_schema_lock import test_v1_1_report_includes_race_aware_columns; test_v1_1_report_includes_race_aware_columns(); print('V1_SCHEMA_LOCK_PASS')"
          python -c "from src.v2.tests.test_schema_lock import test_v2_cohort_summary_columns_locked; test_v2_cohort_summary_columns_locked(); print('V2_SCHEMA_LOCK_PASS')"
