services:
  - type: web
    name: pfas-enterprise-5
    env: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SCREENING_USE_ONLY
        value: "true"
      - key: COST_PER_LAB_ANALYSIS_USD
        value: "350"
      - key: KG_CO2_PER_SAMPLE
        value: "2.5"
      - key: DATABASE_URL
        fromDatabase:
          name: pfas-enterprise-db
          property: connectionString

databases:
  - name: pfas-enterprise-db
    plan: starter
